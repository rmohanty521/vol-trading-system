[project]
name = "voltrade"
version = "0.1.0"
description = "Volatility-aware trading system: ML vol forecasts drive position sizing"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
